<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aspec Captura - Sistema de inventário patrimonial com captura de fotos" />
    <meta name="theme-color" content="#2F6FED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: dark)" />
    <meta name="version" content="0.9.0" />
    <title>Aspec Captura</title>
    <base href="/" />
    
    <!-- Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSP: Allow inline styles for MudBlazor and WASM, plus http: for local dev API -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; font-src 'self' https: http: data:; img-src 'self' data: https: http: blob:; style-src 'self' 'unsafe-inline' https: http:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: blob:; connect-src 'self' https: http: ws: wss:;">

    <!-- Theme initialization -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('aspec-captura-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts - Space Grotesk, Inter, JetBrains Mono -->
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Material Design Icons and Symbols Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0&display=block"
        rel="stylesheet">

    <!-- Critical CSS (inlined for performance) -->
    <style>
        /* Critical above-the-fold CSS - see css/critical.css for source */
        :root{--color-primary:#2F6FED;--color-surface:#FFFFFF;--color-background:#F8FAFC;--color-text:#111827;--color-text-secondary:#6B7280;--space-2:0.5rem;--space-4:1rem;--space-6:1.5rem;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-size-base:1rem;--line-height-base:1.5}[data-theme="dark"]{--color-surface:#1F2937;--color-background:#111827;--color-text:#F9FAFB;--color-text-secondary:#D1D5DB}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{font-size:16px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{font-family:var(--font-sans);font-size:var(--font-size-base);line-height:var(--line-height-base);color:var(--color-text);background-color:var(--color-background);min-height:100vh;overflow-x:hidden}#app{display:flex;flex-direction:column;min-height:100vh;position:relative}.loading-progress{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px}.loading-progress circle{fill:none;stroke:var(--color-primary);stroke-width:4;stroke-linecap:round;transform-origin:50% 50%}.loading-progress circle:first-child{stroke:var(--color-background);stroke-width:8}.loading-progress circle:last-child{stroke-dasharray:251.2;stroke-dashoffset:0;animation:loading-progress-animation 2s ease-in-out infinite}@keyframes loading-progress-animation{0%{stroke-dashoffset:251.2;transform:rotate(0deg)}50%{stroke-dashoffset:62.8;transform:rotate(180deg)}100%{stroke-dashoffset:251.2;transform:rotate(360deg)}}.loading-progress-text{position:fixed;top:calc(50% + 60px);left:50%;transform:translateX(-50%);color:var(--color-text-secondary);font-size:0.875rem;text-align:center}.loading-progress-text::after{content:'Carregando...'}#blazor-error-ui{position:fixed;bottom:0;left:0;right:0;background:#dc2626;color:white;padding:var(--space-4);display:none;z-index:9999;font-size:0.875rem;text-align:center}#blazor-error-ui .reload{color:white;text-decoration:underline;margin-left:var(--space-2)}#blazor-error-ui .dismiss{cursor:pointer;margin-left:var(--space-4);font-weight:bold}:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
    </style>

    <!-- Design Tokens (must load first) -->
    <link rel="stylesheet" href="css/design-tokens.css" />

    <!-- Tailwind CSS Output -->
    <link rel="stylesheet" href="css/output.css" />

    <!-- Custom App CSS -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/fluid-typography.css" />
    <link rel="stylesheet" href="css/ripple.css" />
    <link rel="stylesheet" href="css/pull-to-refresh.css" />
    <link rel="stylesheet" href="css/touch-action.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/performance.css" />
    <link rel="stylesheet" href="css/app-global.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile-safe-area.css" />
    <link rel="stylesheet" href="css/recognition.css" />
    <link rel="stylesheet" href="css/update-notification.css" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="images/aspec_logo.png" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="images/aspec_logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="images/aspec_logo.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/app.js"></script>
    <script src="js/library-loader.js"></script>
    <script src="js/db-interop.js"></script>
    <script src="js/camera-interop.js"></script>
    <script src="js/recognition-interop.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/image-compressor.js"></script>
    <script src="js/push.js"></script>
    <script src="js/performance.js"></script>
    <script src="js/update-service.js"></script>
    <script src="js/camera-test.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/ripple.js"></script>
    <script src="js/pull-to-refresh.js"></script>
    <script src="js/offline-queue.js"></script>
    <script src="js/data-cache.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Service Worker Registration with Update Notification
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => {
                    console.log('[SW] Registered:', registration);
                    
                    // Check for updates every hour
                    setInterval(() => {
                        registration.update();
                    }, 60 * 60 * 1000);
                    
                    // Listen for updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // New version available
                                if (confirm('Nova versão disponível! Deseja atualizar agora?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('[SW] Registration failed:', error);
                });
        }
    </script>
</body>

</html>
