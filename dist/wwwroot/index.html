<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aspec Captura - Sistema de inventário patrimonial com captura de fotos" />
    <meta name="theme-color" content="#1B3A5F" />
    <meta name="version" content="0.2.3" />
    <title>Aspec Captura</title>
    <base href="/" />
    <!-- CSP: Allow inline styles for MudBlazor and WASM, plus http: for local dev API -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; font-src 'self' https: http: data:; img-src 'self' data: https: http: blob:; style-src 'self' 'unsafe-inline' https: http:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: blob:; connect-src 'self' https: http: ws: wss:;">

    <!-- Theme initialization -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('aspec-captura-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts - Outfit & Roboto -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
        rel="stylesheet">

    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Custom App CSS -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/app-global.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile-safe-area.css" />
    <link rel="stylesheet" href="css/update-notification.css" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="images/aspec_logo.png" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="images/aspec_logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="images/aspec_logo.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/app.js"></script>
    <script src="js/db-interop.js"></script>
    <script src="js/camera-interop.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/image-compressor.js"></script>
    <script src="js/push.js"></script>
    <script src="js/performance.js"></script>
    <script src="js/update-service.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Service Worker Registration with Update Notification
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => {
                    console.log('[SW] Registered:', registration);
                    
                    // Check for updates every hour
                    setInterval(() => {
                        registration.update();
                    }, 60 * 60 * 1000);
                    
                    // Listen for updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // New version available
                                if (confirm('Nova versão disponível! Deseja atualizar agora?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('[SW] Registration failed:', error);
                });
        }
    </script>
</body>

</html>
